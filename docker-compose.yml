services:
  mongo:
    image: mongo:8
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: .env
    environment: {MONGODB_URI: mongodb://mongo:27017}
    depends_on: {mongo: {condition: service_healthy}}
    ports: ["8000:8000"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 30s, timeout: 5s, retries: 3}
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    env_file: .env
    depends_on: {backend: {condition: service_healthy}}
    ports: ["8501:8501"]
volumes: {mongo_data: {}}
